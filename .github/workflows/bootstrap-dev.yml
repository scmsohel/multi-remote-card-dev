name: Bootstrap DEV from Public Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact PUBLIC snapshot
        uses: actions/checkout@v4
        with:
          repository: scmsohel/multi-remote-card
          ref: 0c420f63a3bf24522e50a6caf3141761304ea508
          path: public-snapshot
          fetch-depth: 1

      - name: Promote snapshot into DEV
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/release.yml' \
            --exclude '.github/workflows/bootstrap-dev.yml' \
            public-snapshot/ ./

      - name: Commit DEV baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'DEV already matches the selected snapshot.'
            exit 0
          fi
          git commit -m 'Initialize DEV from public snapshot 0c420f63'
          git push origin main
