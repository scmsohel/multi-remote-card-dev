name: One-time remove remote names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact requested changes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'remote-designs/fan.js': [
                  ('\n      <div class="design-title design-title-bottom">${ctx.escape(ctx.room.device_name || this.defaultName)}</div>`;', '\n      `;'),
              ],
              'remote-designs/walton-ceiling-fan.js': [
                  ('\n        <div class="walton-device-name">${ctx.escape(ctx.room.device_name || this.defaultName)}</div>\n      </div>`;', '\n      </div>`;'),
              ],
              'multi-remote-card.js': [
                  ('\n      <div class="design-title design-title-bottom">${ctx.escape(ctx.room.device_name || this.defaultName)}</div>`;', '\n      `;'),
                  ('\n        <div class="walton-device-name">${ctx.escape(ctx.room.device_name || this.defaultName)}</div>\n      </div>`;', '\n      </div>`;'),
                  ("fields.push({name:p+'device_name',label:`Remote ${n} Device Name`,selector:{text:{}}});", ''),
              ],
          }

          for filename, reps in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {filename}')
              path.write_text(text)
          PY
      - name: Commit requested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-designs/fan.js remote-designs/walton-ceiling-fan.js multi-remote-card.js
          git commit -m "Remove remote name display and editor option"
          git push
