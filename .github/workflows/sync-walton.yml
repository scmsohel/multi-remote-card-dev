name: Sync Remote Bundles

on:
  push:
    branches:
      - main
    paths:
      - 'remote-designs/fan.js'
      - 'remote-designs/walton-ceiling-fan.js'
      - 'remote-designs/box.js'
      - '.github/workflows/sync-walton.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync remote sources into bundled card
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('multi-remote-card.js')
          text = main.read_text()

          fan = Path('remote-designs/fan.js').read_text()
          fan = fan.replace('export const fanRemote', 'const fanRemote', 1)
          fan_match = re.search(r'(?m)^const\s+fanRemote\s*=', text)
          if not fan_match:
              raise RuntimeError('Could not find bundled Basic Fan definition')
          fan_start = fan_match.start()
          fan_end = text.index('// Modern segmented Walton remote layout.', fan_start)
          text = text[:fan_start] + fan.rstrip() + '\n' + text[fan_end:]

          walton = Path('remote-designs/walton-ceiling-fan.js').read_text()
          walton = walton.replace('export const waltonCeilingFanRemote', 'const waltonCeilingFanRemote', 1)
          walton = walton.replace('class="walton-speed', 'class="speed walton-speed')
          walton = walton.replace('class="walton-center"', 'class="fan-button walton-center"')
          walton = walton.replace('class="walton-pill"', 'class="mode-button walton-pill"')
          walton = walton.replace('<button data-action="timer_', '<button class="mode-button" data-action="timer_')
          walton = walton.replace('<button data-action="eco">', '<button class="mode-button" data-action="eco">')
          walton = walton.replace('<button data-action="reverse">', '<button class="wide-button" data-action="reverse">')

          walton_start = text.index('// Modern segmented Walton remote layout.')
          box_match = re.search(r'(?m)^const\s+boxRemote\s*=', text[walton_start:])
          if not box_match:
              raise RuntimeError('Could not find bundled Box definition')
          walton_end = walton_start + box_match.start()
          text = text[:walton_start] + '// Modern segmented Walton remote layout.\n' + walton.rstrip() + '\n' + text[walton_end:]

          box = Path('remote-designs/box.js').read_text()
          box = box.replace('export const boxRemote', 'const boxRemote', 1)
          box_match = re.search(r'(?m)^const\s+boxRemote\s*=', text)
          if not box_match:
              raise RuntimeError('Could not find bundled Box definition after Walton sync')
          box_start = box_match.start()
          designs_match = re.search(r'(?m)^const\s+REMOTE_DESIGNS\s*=', text[box_start:])
          if not designs_match:
              raise RuntimeError('Could not find REMOTE_DESIGNS marker')
          box_end = box_start + designs_match.start()
          text = text[:box_start] + box.rstrip() + '\n' + text[box_end:]

          # Support text controls in the visual editor and keep them at the room root,
          # so editable preset labels render immediately and persist with the card config.
          schema_pattern = r"for\(const c of d\.controls\)fields\.push\(\{name:p\+c\.key,label:`Remote \$\{n\} \$\{c\.label\}`,selector:\{entity:\{\}\}\}\);return fields;\}"
          schema_replacement = "for(const c of d.controls)fields.push({name:p+c.key,label:`Remote ${n} ${c.label}`,selector:c.type==='text'?{text:{}}:{entity:{}}});return fields;}"
          text, schema_count = re.subn(schema_pattern, schema_replacement, text, count=1)
          if schema_count == 0 and schema_replacement not in text:
              raise RuntimeError('Could not update visual editor schema for text controls')

          value_pattern = r"if\(k==='fan'\|\|k==='light'\)return r\[k\]\|\|'';return r\.actions\?\.\[k\]\|\|r\[k\]\|\|'';\}"
          value_replacement = "if(k==='fan'||k==='light'||k.endsWith('_label'))return r[k]||'';return r.actions?.[k]||r[k]||'';}"
          text, value_count = re.subn(value_pattern, value_replacement, text, count=1)
          if value_count == 0 and value_replacement not in text:
              raise RuntimeError('Could not update config value handling for text controls')

          collect_pattern = r"for\(const c of d\.controls\)\{const x=v\[`remote\$\{n\}_\$\{c\.key\}`\];if\(x\)a\[c\.key\]=x;\}return\{name:this\._multiple\?\(v\[`remote\$\{n\}_name`\]\|\|`REMOTE \$\{n\}`\):undefined,design:id,device_name:v\[`remote\$\{n\}_device_name`\]\|\|d\.defaultName,fan:v\[`remote\$\{n\}_fan`\]\|\|'',light:v\[`remote\$\{n\}_light`\]\|\|'',actions:a\};"
          collect_replacement = "const extra={};for(const c of d.controls){const x=v[`remote${n}_${c.key}`];if(c.type==='text'){if(x!==undefined&&x!==null&&x!=='')extra[c.key]=x;}else if(x)a[c.key]=x;}return{name:this._multiple?(v[`remote${n}_name`]||`REMOTE ${n}`):undefined,design:id,device_name:v[`remote${n}_device_name`]||d.defaultName,fan:v[`remote${n}_fan`]||'',light:v[`remote${n}_light`]||'',...extra,actions:a};"
          text, collect_count = re.subn(collect_pattern, collect_replacement, text, count=1)
          if collect_count == 0 and collect_replacement not in text:
              raise RuntimeError('Could not update config collection for text controls')

          main.write_text(text)

      - name: Commit bundled card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi-remote-card.js
          if git diff --cached --quiet; then
            echo 'No bundle changes to commit.'
            exit 0
          fi
          git commit -m 'Sync remote design bundles'
          git push origin main
